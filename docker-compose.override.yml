services:
  pgadmin:
    ports:
      - "5050:5050"

  backend:
    ports:
      - "8888:8000"
    volumes:
      - ./backend/app:/app
    environment:
      - JUPYTER=jupyter lab --ip=0.0.0.0 --allow-root --NotebookApp.custom_display_url=http://127.0.0.1:8888
      - SERVER_HOST=http://${DOMAIN?Variable not set}
    command:
      - /opt/venv/bin/fastapi
      - run
      - --reload
      - "app/main.py"

  export-worker:
    volumes:
      - ./backend/app:/app
    environment:
      - WATCHFILES_FORCE_POLLING=true
    command:
      - /opt/venv/bin/watchfiles
      - --filter
      - python
      - python -m app.worker.export_worker
      - /app
    develop:
      watch:
        - path: ./backend
          action: sync
          target: /app
          ignore:
            - ./backend/.venv
            - .venv
        - path: ./backend/pyproject.toml
          action: rebuild
