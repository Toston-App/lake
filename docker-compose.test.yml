services:
  investment-test-db:
    image: postgres:16
    environment:
      POSTGRES_USER: investment_test
      POSTGRES_PASSWORD: investment_test
      POSTGRES_DB: investment_test
    ports:
      - "127.0.0.1:${INVESTMENT_TEST_DB_PORT:-55432}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U investment_test -d investment_test"]
      interval: 2s
      timeout: 2s
      retries: 20
